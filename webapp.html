```html
<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موبائل ویڈیو جنریٹر - لوکل اے آئی</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
            موبائل کلائنٹ ویڈیو اسٹوڈیو
        </h1>
        <p class="text-xs text-slate-400 mt-1">بغیر کسی API اور سرور کاسٹ کے - ۱۰۰٪ لوکل پروسیسنگ</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex flex-col gap-4">
        
        <!-- Input Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <label class="block text-sm font-medium text-slate-300 mb-2">اپنا اسکرپٹ یا متن یہاں لکھیں:</label>
            <textarea id="scriptInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500 resize-none" placeholder="یہاں کچھ بھی ٹائپ کریں...">خوش آمدید! یہ ایک موبائل فرینڈلی اے آئی ویڈیو جنریٹر ہے جو آپ کے براؤزر کے اندر ہی کام کرتا ہے۔</textarea>
            
            <button id="generateBtn" class="mt-3 w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-medium py-3 rounded-xl transition shadow-lg text-sm cursor-pointer">
                ویڈیو جنریٹ اور ریکارڈ کریں 🎥
            </button>
        </div>

        <!-- Progress & Status Section (Hidden by default) -->
        <div id="progressSection" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-2">
            <div class="flex justify-between text-xs text-slate-300">
                <span id="progressStatusText">ویڈیو تیار ہو رہی ہے...</span>
                <span id="progressPercentage" class="font-bold text-cyan-400">0%</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-slate-800">
                <div id="progressBar" class="bg-gradient-to-r from-cyan-500 to-purple-500 h-full w-0 transition-all duration-150"></div>
            </div>
            <div class="flex justify-between text-[11px] text-slate-400 mt-1">
                <span>بقیہ وقت: <strong id="timeLeft" class="text-white">-- ثانے</strong></span>
                <span id="timeElapsed">0s / 0s</span>
            </div>
        </div>

        <!-- Video Preview Canvas Container (9:16 Shorts Ratio) -->
        <div class="relative w-full aspect-[9/16] max-h-[350px] bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center shadow-2xl">
            <canvas id="videoCanvas" width="360" height="640" class="w-full h-full object-contain"></canvas>
            <div id="statusBadge" class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs text-cyan-400 border border-cyan-500/30">
                تیار ہے
            </div>
        </div>

        <!-- Download Section -->
        <div id="downloadSection" class="hidden">
            <a id="downloadBtn" class="block text-center w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-lg text-sm" download="generated-video.webm">
                ویڈیو ڈاؤن لوڈ کریں 📥
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-500 py-2">
        Powered by Web Speech API & MediaRecorder
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const scriptInput = document.getElementById('scriptInput');
        const generateBtn = document.getElementById('generateBtn');
        const statusBadge = document.getElementById('statusBadge');
        const downloadSection = document.getElementById('downloadSection');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const progressPercentage = document.getElementById('progressPercentage');
        const progressStatusText = document.getElementById('progressStatusText');
        const timeLeft = document.getElementById('timeLeft');
        const timeElapsed = document.getElementById('timeElapsed');
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');

        let animationFrameId;

        // Draw background and text on canvas
        function drawBackground(text = "متن درج کریں...", progress = 0) {
            let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0f172a');
            gradient.addColorStop(0.5, '#1e1b4b');
            gradient.addColorStop(1, '#311042');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Glowing circle animation
            ctx.fillStyle = 'rgba(6, 182, 212, 0.15)';
            ctx.beginPath();
            ctx.arc(180 + Math.sin(progress) * 50, 320 + Math.cos(progress) * 50, 120, 0, Math.PI * 2);
            ctx.fill();

            // Text Box background
            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.roundRect(30, 240, 300, 160, 20);
            ctx.fill();
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Render Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            wrapText(ctx, text, 180, 320, 260, 28);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for(let k = 0; k < lines.length; k++) {
                context.fillText(lines[k], x, startY + (k * lineHeight));
            }
        }

        let p = 0;
        function loop() {
            p += 0.03;
            drawBackground(scriptInput.value || "متن درج کریں...", p);
            animationFrameId = requestAnimationFrame(loop);
        }
        loop();

        // Handle Video Generation & Recording with Accurate Progress
        generateBtn.addEventListener('click', async () => {
            const text = scriptInput.value.trim();
            if(!text) {
                alert('براہ کرم کچھ متن لکھیں!');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = 'جنریٹ ہو رہا ہے...';
            statusBadge.textContent = 'ریکارڈنگ جاری ہے...';
            downloadSection.classList.add('hidden');
            progressSection.classList.remove('hidden');

            // Calculate estimated duration based on text length (approx 15 words per 5 seconds)
            const wordCount = text.split(/\s+/).length;
            const estimatedDuration = Math.max(3, Math.ceil((wordCount / 3)) * 1000); // milliseconds

            const stream = canvas.captureStream(30);
            let recorder;
            let chunks = [];

            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch (e) {
                recorder = new MediaRecorder(stream);
            }

            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(blob);
                downloadBtn.href = videoURL;
                downloadSection.classList.remove('hidden');
                statusBadge.textContent = 'مکمل!';
                progressStatusText.textContent = 'ویڈیو کامیابی سے بن گئی!';
                progressBar.style.width = '100%';
                progressPercentage.textContent = '100%';
                timeLeft.textContent = '0 ثانے';
                generateBtn.disabled = false;
                generateBtn.textContent = 'دوبارہ جنریٹ کریں 🎥';
            };

            recorder.start();

            // Progress Bar & Timer Logic
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let percent = Math.min(98, Math.floor((elapsed / estimatedDuration) * 100));
                let remainingSec = Math.max(0, Math.ceil((estimatedDuration - elapsed) / 1000));

                progressBar.style.width = percent + '%';
                progressPercentage.textContent = percent + '%';
                timeLeft.textContent = remainingSec + ' ثانے';
                timeElapsed.innerText = Math.floor(elapsed / 1000) + 's / ' + Math.ceil(estimatedDuration / 1000) + 's';

                if (elapsed >= estimatedDuration) {
                    clearInterval(timerInterval);
                }
            }, 100);

            // Speech Synthesis
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                
                utterance.onend = () => {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        recorder.stop();
                    }, 300);
                };

                utterance.onerror = () => {
                    clearInterval(timerInterval);
                    recorder.stop();
                };

                window.speechSynthesis.speak(utterance);
            } else {
                setTimeout(() => {
                    clearInterval(timerInterval);
                    recorder.stop();
                }, estimatedDuration);
            }
        });
    </script>
</body>
</html>
